name: Supabase DB Migrations

on:
  push:
    branches:
      - main
    paths:
      - "frontend/db/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secret
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "SUPABASE_DB_URL is missing. Add it in GitHub Secrets." >&2
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare migration directory for Supabase CLI
        run: |
          mkdir -p supabase/migrations
          cp -f frontend/db/migrations/*.sql supabase/migrations/

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
